iec_type = "BOOL"
iec_address = "%MX0.7"
offset = 1
size = 1
bit = 7
writable = true
description = "HMI-Pause One-Shot-Schrittkette (Halten/Toggle via Handshake). Pause: Ventile zu + Restzeit-Timer eingefroren; erneut = fortsetzen (Ventile wieder auf)."

