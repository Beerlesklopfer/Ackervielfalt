iec_address = "%MD8#24"
offset = 242
size = 1
description = "Warterang je Ventil (1..24) aus FB_VALVE_ARBITER: 0=offen/inaktiv, 1=als naechstes dran, 2..=Warteposition (Index-Prioritaet). Non-retained, von PLC_PRG geschrieben. HMI zeigt wartenden Beeten ihren Platz in der Schlange."

