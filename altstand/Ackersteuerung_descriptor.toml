iec_address = "%MX0.6"
offset = 1
size = 1
bit = 6
writable = true
description = "HMI-Stop One-Shot-Schrittkette (Puls via Handshake). Bricht den laufenden Lauf ab: alle Ventile zu, Schritte -> idle; neuer Start noetig."

[[groups.fields]]
